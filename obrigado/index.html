<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anotado! · CentralPinhal</title>
<!-- Página de obrigado: aparece depois que a pessoa entra na lista. Fica fora do Google. -->
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FBF7ED">
<meta name="color-scheme" content="only light">
<link rel="icon" type="image/png" href="../logo.png">
<link rel="preload" href="../fontes/IvyOraText-Light-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* as mesmas fontes e cores da página da lista */
@font-face { font-family: "IvyOra Text"; font-style: normal; font-weight: 300; font-display: swap; src: url("../fontes/IvyOraText-Light-latin.woff2") format("woff2"); }
@font-face { font-family: "IvyOra Text"; font-style: italic; font-weight: 300; font-display: swap; src: url("../fontes/IvyOraText-LightItalic-latin.woff2") format("woff2"); }
@font-face { font-family: "Space Mono"; font-style: normal; font-weight: 700; font-display: swap; src: url("../fontes/SpaceMono-Bold-latin.woff2") format("woff2"); }
:root {
  --papel: #FBF7ED;
  --cartao: #F1EBDD;
  --linha: #E2D7C1;
  --tinta: #3E2C0F;
  --tinta-suave: #75664B;
  --amarelo: #D68732;
  --telha: #A44919;

  --f-titulo: "IvyOra Text", "Iowan Old Style", "Palatino", Georgia, serif;
  --f-texto: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-mono: "Space Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: only light;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100svh;
  display: grid; grid-template-rows: auto 1fr;
  background: var(--papel); color: var(--tinta);
  font: 16px/1.55 var(--f-texto);
  padding: env(safe-area-inset-top, 0px) max(20px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(20px, env(safe-area-inset-left, 0px));
}
img { max-width: 100%; height: auto; display: block; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--amarelo); outline-offset: 3px; }

.topo { width: 100%; max-width: 1080px; margin-inline: auto; padding-block: 22px 0; }
.marca {
  display: inline-flex; align-items: center; gap: 10px; text-decoration: none;
  font-family: var(--f-titulo); font-weight: 300; font-size: 1.45rem; letter-spacing: -0.01em;
}
.marca img { width: 34px; height: 34px; }
.marca em { font-style: italic; color: var(--amarelo); }

main { display: grid; place-items: center; padding-block: 32px 56px; }
.pronto {
  width: 100%; max-width: 480px;
  background: var(--cartao); border: 1px solid var(--linha); border-radius: 22px;
  padding: 32px 30px 28px;
  display: grid; gap: 14px; justify-items: start;
  animation: subir .7s cubic-bezier(.22, 1, .36, 1) both;
}
.pronto .pinha { width: 128px; transform-origin: 50% 100%; animation: pular .8s cubic-bezier(.34, 1.56, .64, 1) .25s both; }
.sobretitulo {
  margin: 4px 0 0;
  font-family: var(--f-mono); font-size: 0.72rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.12em; color: var(--telha);
}
h1 {
  margin: 0;
  font-family: var(--f-titulo); font-weight: 300;
  font-size: clamp(2.2rem, 1.8rem + 1.6vw, 2.8rem); line-height: 1.04; letter-spacing: -0.02em;
  overflow-wrap: anywhere;
}
.fala { margin: 0; font-size: 1.05rem; }
.assinatura {
  margin: 0; font-family: var(--f-mono); font-size: 0.75rem; font-weight: 700;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--amarelo);
}
.voltar {
  margin: 10px 0 0; padding-top: 16px; width: 100%;
  border-top: 1px solid var(--linha);
  font-size: 0.86rem; color: var(--tinta-suave);
}
.voltar a { text-underline-offset: 3px; }

@keyframes subir { from { opacity: 0; transform: translate3d(0, 18px, 0); } to { opacity: 1; transform: none; } }
@keyframes pular {
  0% { opacity: 0; transform: translate3d(0, 30%, 0) scale(.7); }
  70% { opacity: 1; transform: translate3d(0, -4%, 0) scale(1.04); }
  100% { opacity: 1; transform: none; }
}
@media (prefers-reduced-motion: reduce) { .pronto, .pronto .pinha { animation: none; } }
@media (max-width: 420px) { .pronto { padding: 26px 22px 22px; } }
</style>
</head>
<body>
<header class="topo">
  <a class="marca" href="../" aria-label="CentralPinhal, voltar para a página da lista">
    <img src="../logo.png" alt="" width="34" height="34">
    <span>Central<em>pinhal</em></span>
  </a>
</header>

<main>
  <section class="pronto" aria-labelledby="titulo">
    <img class="pinha" src="../pinha.png" alt="" width="600" height="592">
    <p class="sobretitulo">Você está na lista</p>
    <h1 id="titulo">Anotado!</h1>
    <script>
      // O primeiro nome vem da página da lista, guardado só nesta aba (nada no endereço).
      try {
        const nome = sessionStorage.getItem("centralpinhal-nome");
        if (nome) document.getElementById("titulo").textContent = `Anotado, ${nome}!`;
      } catch (e) {}
    </script>
    <p class="fala">Quando a CentralPinhal abrir, você fica sabendo antes de todo mundo. Agora vou voltar a olhar pro nada e pensar na vida kkkk</p>
    <p class="assinatura">— Pinha</p>
    <p class="voltar"><a href="../">Voltar para a página da CentralPinhal</a></p>
  </section>
</main>
</body>
</html>
